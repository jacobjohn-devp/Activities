<title>AI Product Management</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Internal Learning system. Flat grey ground, one hue per part, square ink title cards over circle/pill hero shapes; single light world by design. */
:root {
  --surface: #ebebeb; --surface-raised: #ffffff; --ink: #111111; --ink-muted: #5c5c5c; --on-ink: #ffffff; --border: #cfcfcf;
  --lime: #9bcb1a; --orange: #f6a800; --orange-deep: #ec7404; --pink: #e98aa0; --sky: #24b4e6; --yellow: #f4b400; --blue: #3f8fda; --error: #ad2f27;
  --card: #111111; --on-card: #ffffff; --track: #111111; --blend: multiply;
  --font-sans: "Inter", "Helvetica Neue", Arial, sans-serif; --font-display: "Inter Tight", "Inter", "Helvetica Neue", Arial, sans-serif; --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --space-1: 4px; --space-2: 8px; --space-4: 16px; --space-6: 24px; --space-12: 48px;
  --hue: var(--lime);
  color-scheme: light;
}
/* Orbit: the dark theme. Ground goes to deep graphite, label cards to pure black, overlaps lighten instead of darken */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --surface: #17181a; --surface-raised: #222326; --ink: #f0f0f0; --ink-muted: #a6a6a6; --on-ink: #111111; --border: #36373b;
  --card: #000000; --on-card: #ffffff; --track: #3a3b3f; --blend: screen; --error: #ff7a6e; color-scheme: dark; } }
:root[data-theme="dark"] {
  --surface: #17181a; --surface-raised: #222326; --ink: #f0f0f0; --ink-muted: #a6a6a6; --on-ink: #111111; --border: #36373b;
  --card: #000000; --on-card: #ffffff; --track: #3a3b3f; --blend: screen; --error: #ff7a6e; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--surface); color: var(--ink); font-family: var(--font-sans); font-size: 16px; line-height: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: var(--space-6) var(--space-12); }
a { color: var(--ink); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; letter-spacing: -0.02em; font-family: var(--font-display); font-weight: 700; }
.hue-lime { --hue: var(--lime); } .hue-sky { --hue: var(--sky); } .hue-orange { --hue: var(--orange); } .hue-pink { --hue: var(--pink); }

/* top bar */
.bar { display: flex; justify-content: space-between; align-items: center; gap: var(--space-4); padding-bottom: var(--space-6); border-bottom: 1px solid var(--border); margin-bottom: var(--space-12); }
.mark { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; }
.bar nav { display: flex; gap: var(--space-4); font-size: 14px; }

/* shared pieces */
.tcard { background: var(--card); color: var(--on-card); padding: var(--space-4); position: relative; display: flex; flex-direction: column; justify-content: flex-end; }
.tcard .tmark { position: absolute; top: var(--space-4); right: var(--space-4); font-size: 11px; line-height: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.tcard .tnum { position: absolute; top: var(--space-4); left: var(--space-4); font-size: 12px; line-height: 16px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--hue); }
.tcard .tname { font-weight: 700; letter-spacing: -0.015em; }
.tcard .tsub { margin-top: var(--space-1); font-size: 12px; line-height: 16px; font-weight: 600; color: var(--hue); }
.shape { fill: var(--hue); } .shape-ring { fill: none; stroke: var(--hue); stroke-width: 36px; } .mult { mix-blend-mode: var(--blend); }
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 var(--space-2); border-radius: 9999px; font-size: 12px; line-height: 16px; font-weight: 600; background: var(--card); color: var(--on-card); white-space: nowrap; }
.tag.hue { background: var(--hue); color: #111111; }
.tag.line { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn { font: inherit; font-size: 14px; line-height: 20px; font-weight: 700; height: 40px; padding: 0 var(--space-4); border: 2px solid var(--ink); background: var(--card); color: var(--on-card); cursor: pointer; display: inline-flex; align-items: center; text-decoration: none; }
.btn.secondary { background: transparent; color: var(--ink); }
.btn:hover { background: var(--ink-muted); border-color: var(--ink-muted); color: var(--on-ink); }
.progress { width: 100%; }
.progress .head { display: flex; justify-content: space-between; font-size: 12px; line-height: 16px; font-weight: 600; margin-bottom: var(--space-1); }
.progress .track { height: 8px; border-radius: 9999px; background: var(--track); overflow: hidden; }
.progress .fill { height: 100%; border-radius: 9999px; background: var(--hue); }
.eyebrow { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }

/* home hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-12); align-items: end; margin-bottom: var(--space-12); }
.hero h1 { font-size: 64px; line-height: 60px; letter-spacing: -0.03em; }
.hero p.lede { font-size: 18px; line-height: 28px; max-width: 34em; margin: var(--space-6) 0 0; }
.hero-art { position: relative; height: 340px; overflow: hidden; }
.hero-art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero-art .tcard { position: absolute; left: 0; bottom: var(--space-6); width: 260px; min-height: 160px; }
.hero-art .tname { font-size: 24px; line-height: 28px; }
.facts { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-6); }

.how { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-6); padding: var(--space-6) 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-bottom: var(--space-12); }
.how h3 { font-size: 14px; line-height: 20px; margin-bottom: var(--space-1); }
.how p { margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
.shelf { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }

.part { margin-bottom: var(--space-12); }
.part-head { display: flex; align-items: baseline; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-6); }
.part-head h2 { font-size: 32px; line-height: 36px; }
.part-head p { margin: 0; color: var(--ink-muted); font-size: 14px; max-width: 46em; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-6); }
.course { text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: var(--space-2); }
.course .heroimg { position: relative; height: 210px; overflow: hidden; }
.course .heroimg svg { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform .3s ease; }
.course:hover .heroimg svg { transform: scale(1.04); }
.course .tcard { position: absolute; left: 0; bottom: var(--space-4); width: 66%; min-height: 128px; }
.course .tname { font-size: 20px; line-height: 24px; }
.course .q { margin: var(--space-2) 0 0; font-size: 14px; line-height: 20px; }
.course .meta { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; font-size: 12px; line-height: 16px; color: var(--ink-muted); }

/* chapter */
.ch-hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: var(--space-12); align-items: end; margin-bottom: var(--space-12); }
.ch-hero .heroimg { position: relative; height: 300px; overflow: hidden; }
.ch-hero .heroimg svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ch-hero h1 { font-size: 48px; line-height: 50px; letter-spacing: -0.025em; margin-top: var(--space-2); }
.ch-hero .q { font-size: 18px; line-height: 28px; margin: var(--space-4) 0 0; max-width: 34em; }
.ch-hero .tcard { position: absolute; left: 0; bottom: var(--space-6); width: 240px; min-height: 140px; }
.ch-hero .tname { font-size: 22px; line-height: 26px; }
.layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: var(--space-12); align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--space-6)); display: grid; gap: var(--space-4); }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-1); font-size: 14px; line-height: 20px; }
.toc a { display: flex; gap: var(--space-2); text-decoration: none; padding: var(--space-1) 0; color: var(--ink-muted); }
.toc a:hover { color: var(--ink); }
.toc a .dot { flex: none; width: 12px; height: 12px; border-radius: 9999px; margin-top: 4px; box-shadow: inset 0 0 0 2px var(--ink); }
.toc a.done .dot { background: var(--hue); box-shadow: inset 0 0 0 2px var(--ink); }
.toc a.done { color: var(--ink); }
.content { max-width: 720px; min-width: 0; }
.lesson { padding-bottom: var(--space-12); margin-bottom: var(--space-12); border-bottom: 1px solid var(--border); scroll-margin-top: var(--space-6); }
.lesson:last-child { border-bottom: 0; }
.lesson-head { display: flex; justify-content: space-between; gap: var(--space-4); align-items: flex-start; margin-bottom: var(--space-4); flex-wrap: wrap; }
.lesson h2 { font-size: 28px; line-height: 34px; }
.lesson h3 { font-size: 18px; line-height: 26px; margin-top: var(--space-6); }
.lesson p, .lesson li { max-width: 66ch; }
.lesson p { margin: var(--space-4) 0 0; }
.lesson ul, .lesson ol { margin: var(--space-4) 0 0; padding-left: 20px; display: grid; gap: var(--space-2); }
.num { font-size: 12px; line-height: 16px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink-muted); }
.callout { margin-top: var(--space-6); background: var(--card); color: var(--on-card); padding: var(--space-4) var(--space-6); }
.callout .eyebrow { color: var(--hue); }
.callout p { margin: var(--space-2) 0 0; }
.callout code { background: #2a2a2a; color: #ffffff; }
.pm { margin-top: var(--space-6); background: var(--surface-raised); padding: var(--space-4) var(--space-6); }
.pm .eyebrow { color: var(--ink); }
.pm ul { margin-top: var(--space-2); }
code { font-family: var(--font-mono); font-size: 13px; background: var(--surface-raised); padding: 1px 4px; }
.tbl { overflow-x: auto; margin-top: var(--space-6); }
table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 20px; min-width: 560px; }
th { text-align: left; font-size: 12px; line-height: 16px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted); font-weight: 600; padding: var(--space-2) var(--space-2) var(--space-2) 0; border-bottom: 2px solid var(--ink); }
td { padding: var(--space-2) var(--space-2) var(--space-2) 0; border-bottom: 1px solid var(--border); vertical-align: top; }
td:first-child { font-weight: 600; }
.check { display: inline-flex; align-items: center; gap: var(--space-2); font-size: 14px; font-weight: 600; cursor: pointer; user-select: none; }
.check input { width: 18px; height: 18px; accent-color: var(--ink); margin: 0; }

/* lab */
.lab { background: var(--surface-raised); padding: var(--space-6); margin-top: var(--space-6); }
.lab-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); }
.field { display: grid; gap: var(--space-1); min-width: 0; }
.field label { font-size: 12px; line-height: 16px; font-weight: 600; }
.field input { font: inherit; font-size: 14px; height: 36px; padding: 0 var(--space-2); border: 1.5px solid var(--ink); border-radius: 2px; background: var(--surface-raised); color: var(--ink); width: 100%; font-variant-numeric: tabular-nums; }
.field small { font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.results { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; margin-top: var(--space-6); background: var(--card); }
.result { background: var(--card); color: var(--on-card); padding: var(--space-4); }
.result .k { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--hue); }
.result .v { font-size: 24px; line-height: 32px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: var(--space-1); }
.result .s { font-size: 12px; line-height: 16px; opacity: .8; }
.lab .note { font-size: 13px; line-height: 20px; color: var(--ink-muted); margin-top: var(--space-4); }
.split { margin-top: var(--space-4); }
.split .bars { display: flex; height: 24px; }
.split .bars div { height: 100%; }
.split .legend { display: flex; flex-wrap: wrap; gap: var(--space-4); font-size: 12px; line-height: 16px; margin-top: var(--space-2); }
.split .sw { display: inline-block; width: 10px; height: 10px; border-radius: 9999px; margin-right: 6px; vertical-align: -1px; }
.c-in { background: var(--ink); } .c-cache { background: var(--ink-muted); } .c-out { background: var(--hue); } .c-think { background: var(--orange-deep); }

/* quiz */
.quiz { display: grid; gap: var(--space-6); margin-top: var(--space-6); }
.qitem { background: var(--surface-raised); padding: var(--space-6); }
.qitem fieldset { border: 0; margin: 0; padding: 0; }
.qitem legend { font-weight: 700; padding: 0; font-size: 16px; line-height: 24px; }
.opts { display: grid; gap: var(--space-2); margin-top: var(--space-4); }
.opt { display: flex; gap: var(--space-2); align-items: flex-start; padding: var(--space-2) var(--space-4); box-shadow: inset 0 0 0 1.5px var(--border); cursor: pointer; font-size: 14px; line-height: 20px; }
.opt input { margin-top: 3px; accent-color: var(--ink); flex: none; }
.opt.right { box-shadow: inset 0 0 0 2px var(--ink); background: color-mix(in srgb, var(--hue) 35%, var(--surface-raised)); }
.opt.wrong { box-shadow: inset 0 0 0 2px var(--error); }
.why { margin-top: var(--space-4); font-size: 14px; line-height: 20px; }
.why strong.bad { color: var(--error); }
.score { font-weight: 700; }

/* glossary */
.gsearch { display: flex; gap: var(--space-4); align-items: center; flex-wrap: wrap; margin-top: var(--space-6); }
.gsearch input { font: inherit; font-size: 14px; height: 40px; padding: 0 var(--space-4); border: 1.5px solid var(--ink); border-radius: 2px; background: var(--surface-raised); color: var(--ink); width: min(360px, 100%); }
.gfilters { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.gfilters button { font: inherit; font-size: 12px; font-weight: 600; height: 28px; padding: 0 var(--space-2); border-radius: 9999px; border: 0; background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink); cursor: pointer; }
.gfilters button[aria-pressed="true"] { background: var(--card); color: var(--on-card); }
dl.gloss { display: grid; grid-template-columns: 200px minmax(0, 1fr); margin: var(--space-6) 0 0; }
dl.gloss dt, dl.gloss dd { padding: var(--space-2) 0; border-bottom: 1px solid var(--border); margin: 0; font-size: 14px; line-height: 20px; }
dl.gloss dt { font-weight: 700; padding-right: var(--space-4); }
dl.gloss dd .tag { height: 20px; margin-left: var(--space-2); font-size: 11px; vertical-align: 1px; }
.empty { font-size: 14px; color: var(--ink-muted); margin-top: var(--space-4); }

/* planned chapter */
.plan-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-6); }
.plan-box { background: var(--surface-raised); padding: var(--space-6); }
.plan-box h2 { font-size: 20px; line-height: 26px; margin-bottom: var(--space-2); }
.plan-box ol, .plan-box ul { margin: var(--space-2) 0 0; padding-left: 20px; display: grid; gap: var(--space-2); font-size: 15px; }
.plan-box p { margin: var(--space-2) 0 0; font-size: 15px; }
.pager { display: flex; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; margin-top: var(--space-12); padding-top: var(--space-6); border-top: 1px solid var(--border); }
.sources { font-size: 13px; line-height: 20px; color: var(--ink-muted); }
.sources a { color: var(--ink-muted); }

@media (max-width: 900px) {
  .hero, .ch-hero { grid-template-columns: minmax(0, 1fr); gap: var(--space-6); }
  .hero h1 { font-size: 44px; line-height: 44px; }
  .ch-hero h1 { font-size: 36px; line-height: 40px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .how { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .toc { position: static; }
  .lab-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .results { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .grid, .how, .plan-grid, .lab-grid { grid-template-columns: minmax(0, 1fr); }
  .hero-art { height: 260px; }
  dl.gloss { grid-template-columns: minmax(0, 1fr); }
  dl.gloss dt { border-bottom: 0; padding-bottom: 0; }
  .bar nav { display: none; }
}
/* ---------- elevation layer ---------- */
/* Type: Inter Tight for display, mono for every label, number and datum */
.eyebrow, .num, .tcard .tnum, .tcard .tmark, .result .k, th, .progress .head, .mark, .tag { font-family: var(--font-mono); letter-spacing: .02em; }
.eyebrow, .num, .mark, th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.tag { font-size: 11px; font-weight: 600; }
.result .v { font-family: var(--font-display); letter-spacing: -0.02em; }
.hero h1 { font-size: 88px; line-height: 80px; letter-spacing: -0.045em; font-weight: 800; }
.part-head h2 { font-size: 40px; line-height: 42px; letter-spacing: -0.03em; }
.tcard .tname { font-family: var(--font-display); letter-spacing: -0.02em; }
.lesson h2 { font-size: 34px; line-height: 38px; letter-spacing: -0.03em; }
body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.theme-btn { font: inherit; font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; height: 28px; padding: 0 var(--space-2); background: transparent; color: var(--ink); border: 0; box-shadow: inset 0 0 0 1.5px var(--ink); border-radius: 9999px; cursor: pointer; }

/* Poster openers, after the Braun posters: a shape bleeding off the edge, an oversized numeral knocked out where the shape crosses it, a black label card */
.poster { position: relative; height: 540px; overflow: hidden; width: 100vw; margin-left: calc(50% - 50vw); margin-top: calc(-1 * var(--space-12)); }
.poster-art { position: absolute; inset: 0; }
.poster-art svg { width: 100%; height: 100%; display: block; }
.pnum { font-family: var(--font-display); font-weight: 800; font-size: 420px; letter-spacing: -0.07em; fill: var(--ink); }
.pnum.knock { fill: var(--surface); }
.poster .tcard { position: absolute; left: max(max(16px, env(safe-area-inset-left, 0px)), calc((100vw - 1320px) / 2)); bottom: 48px; width: min(380px, calc(100% - 32px)); min-height: 220px; padding: var(--space-6); }
.poster .tname { font-size: 40px; line-height: 42px; letter-spacing: -0.035em; }
.poster .tsub { font-size: 12px; font-family: var(--font-mono); }
.poster-foot { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: var(--space-12); align-items: end; padding-block: var(--space-6) var(--space-12); margin-bottom: var(--space-12); border-bottom: 1px solid var(--border); }
.poster-foot .q { font-family: var(--font-display); font-size: 26px; line-height: 34px; letter-spacing: -0.02em; font-weight: 600; margin: var(--space-2) 0 0; max-width: 30em; text-wrap: balance; }
.poster-foot .facts { justify-content: flex-end; margin: 0; }
.poster-foot .intro { grid-column: 1 / -1; margin: 0; color: var(--ink-muted); font-size: 15px; max-width: 60em; }

/* Scroll-driven motion: shapes drift as they pass through the viewport. At rest they sit in their designed position */
@supports (animation-timeline: view()) {
  @media (prefers-reduced-motion: no-preference) {
    .poster-art svg { animation: artDrift linear both; animation-timeline: view(); animation-range: exit 0% exit 100%; transform-origin: 70% 30%; }
    .poster .tcard { animation: cardLift linear both; animation-timeline: view(); animation-range: exit 0% exit 100%; }
    .course .heroimg svg > * { animation: cardIn linear both; animation-timeline: view(); animation-range: entry 0% cover 35%; transform-box: fill-box; transform-origin: 50% 50%; }
    .hero-art svg > * { animation: posterDrift linear both; animation-timeline: view(); animation-range: exit 0% exit 100%; transform-box: fill-box; transform-origin: 50% 50%; }
    .htile .art svg > g:last-child, .htile .art svg > *:not(g) { animation: floatIn linear both; animation-timeline: view(); animation-range: entry 0% cover 40%; }
  }
}
@keyframes posterDrift { to { transform: translateY(-90px) rotate(-6deg) scale(1.04); } }
@keyframes artDrift { to { transform: translateY(-80px) scale(1.08) rotate(-2deg); } }
@keyframes cardLift { to { transform: translateY(-140px); } }
@keyframes cardIn { from { transform: translateX(36px) scale(.92); } to { transform: none; } }
@keyframes floatIn { from { transform: translateY(10px) rotate(-6deg); } to { transform: none; } }

/* Reading mode: notes move into the margin, a progress line tracks the page */
.readline { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; height: 3px; background: var(--hue); transform-origin: 0 50%; transform: scaleX(0); z-index: 60; pointer-events: none; }
.is-chapter .wrap { max-width: 1320px; }
.lesson-body { display: grid; gap: var(--space-6); }

/* Hoppy: the course buddy. A green long-eared face in a knitted grey hood, drawn flat from ellipses and pills */
.buddy, .peek { --knit: #8f8c88; --knit-dark: #7a7773; --rib: #6b6865; --green: #9fc04f; --green-in: #86a83c; --mouth: #c8372d; }

.buddy {
  position: fixed; left: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + var(--space-2)); z-index: 50; pointer-events: none; will-change: transform; }

.critter .whole, .critter .ear, .critter .arm, .critter .eye { transform-box: fill-box; }

@keyframes glide { 0%, 100% { transform: translateY(0) scale(1.02, .98); } 50% { transform: translateY(-9px) scale(.99, 1.01); } }
@keyframes trail { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-6deg); } }
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.012, 1.025); } }
@keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
@keyframes wave { 0%, 100% { transform: rotate(0deg); } 18% { transform: rotate(-135deg); } 34% { transform: rotate(-105deg); } 50% { transform: rotate(-135deg); } 66% { transform: rotate(-105deg); } 82% { transform: rotate(-130deg); } }
@keyframes blink { 50% { transform: scaleY(.08); } }

@media (prefers-reduced-motion: reduce) { .critter.cheer .whole, .critter.cheer .arm, .critter.cheer .ear, .critter .ear, .critter.idle .whole, .critter.hopping .whole, .critter.hopping .ear, .critter.waving .arm-r, .critter.blink .eye { animation: none; } }

/* ---------- chapter 1 content ---------- */
var LESSONS = [
{ t: 'Why precision pays', shelf: 'Durable', html:
'<p>Most bad AI product decisions trace back to a sentence that sounded fine in a meeting. “The model knows our docs.” “We’ll fine-tune it.” “The agent handles it.” Each hides a design choice with a different cost, latency, freshness and failure mode. This chapter gives you the vocabulary to turn those sentences into decisions.</p>' +
'<p>Take “the model knows our docs”. It can mean four different systems:</p>' +
'<div class="tbl"><table><thead><tr><th>Where the knowledge lives</th><th>Freshness</th><th>Cost driver</th><th>Typical failure</th></tr></thead><tbody>' +
'<tr><td>In the weights (fine-tuned)</td><td>Frozen at training time</td><td>Training runs and re-runs</td><td>Confidently stale; can’t cite</td></tr>' +
'<tr><td>In the context (pasted in)</td><td>As fresh as each request</td><td>Input tokens on every call</td><td>Context rot as volume grows</td></tr>' +
'<tr><td>Retrieved (RAG)</td><td>As fresh as the index</td><td>Indexing plus some input tokens</td><td>Right answer never retrieved</td></tr>' +
'<tr><td>Fetched by a tool (agentic search)</td><td>Live</td><td>Extra model turns and latency</td><td>Agent searches badly or stops early</td></tr>' +
'</tbody></table></div>' +
'<div class="pm"><p class="eyebrow">What changes for you</p><ul><li>When someone says the model “knows” or “remembers” something, ask where it lives. The answer decides your freshness guarantee and your unit cost.</li><li>Keep a shared glossary (the last lesson in this chapter has a starter one). Teams that use the same words ship faster.</li></ul></div>' },

{ t: 'Tokens, context and cost', shelf: 'Durable concepts, perishable numbers', html:
'<p>A <strong>token</strong> is the unit a model reads and writes: a common word, a piece of a word, a punctuation mark. In English prose a token averages about three quarters of a word. Code, numbers, non-Latin scripts and unusual formatting use more tokens for the same content. Tokens are the unit of cost, speed and limits, so you should be able to estimate them as easily as you estimate story points.</p>' +
'<h3>The context window</h3><p>The <strong>context window</strong> is everything the model sees in one call: system prompt, tool definitions, conversation history, retrieved documents, images, and the output it is writing. Frontier models now accept hundreds of thousands to around a million tokens. Two consequences matter more than the headline size:</p>' +
'<ul><li><strong>Models are stateless.</strong> Between calls the model remembers nothing. “Memory” in a chat product is your application re-sending history, or a summary of it, on every turn. A 30-turn conversation pays for turn 1’s tokens 30 times unless you cache or compact.</li><li><strong>Bigger isn’t automatically better.</strong> Quality degrades as context fills, well before the limit. This is often called <strong>context rot</strong>: relevant facts in the middle of a long context get missed and irrelevant material distracts. Curating context beats maximising it (Chapter 4).</li></ul>' +
'<h3>How you pay</h3><p>APIs price per million tokens, with <strong>output tokens</strong> typically several times the price of <strong>input tokens</strong>. Reasoning models also generate hidden <strong>thinking tokens</strong>, which are billed as output. <strong>Prompt caching</strong> lets a provider reuse an unchanged prefix (system prompt, tool definitions, a long document) at a large discount, often around 90% off the input price, so prompt structure is a cost decision: stable material first, variable material last. <strong>Batch</strong> APIs trade latency for a large discount on work that can wait hours.</p>' +
'<div class="callout"><p class="eyebrow">Rule of thumb</p><p>Cost per request ≈ uncached input × input price + cached input × cache price + (output + thinking) × output price. The lab at the end of this chapter turns this into a model of a whole feature.</p></div>' +
'<div class="pm"><p class="eyebrow">What changes for you</p><ul><li>Specify a token budget per request the way you’d specify a latency budget.</li><li>For chat and agent features, model cost per <em>session</em>, not per message. Session length is your biggest cost lever.</li><li>Ask engineering what share of input is cached. It’s often the cheapest win available.</li></ul></div>' },

{ t: 'Inference: sampling, structure and speed', shelf: 'Durable', html:
'<p><strong>Inference</strong> is running a trained model to produce output. A model doesn’t emit a word. It produces a probability distribution over the next token, and a <strong>sampling</strong> strategy picks one. Then it repeats.</p>' +
'<ul><li><strong>Temperature</strong> scales how adventurous sampling is. Low for extraction and classification, higher for brainstorming. <strong>Top-p</strong> limits sampling to the most likely tokens that together cover probability p.</li><li><strong>Determinism is not guaranteed</strong>, even at temperature 0. Batching and hardware differences mean the same input can produce different output. Design and test as if every response is a sample, because it is.</li><li><strong>Structured outputs</strong> constrain generation to a JSON schema, so downstream code can rely on the shape. They guarantee the format, not that the content is correct.</li><li><strong>Max tokens</strong> and <strong>stop sequences</strong> bound output length. A truncated answer is a common, silent failure.</li></ul>' +
'<h3>Speed has three numbers</h3><div class="tbl"><table><thead><tr><th>Metric</th><th>What it means</th><th>What users feel</th></tr></thead><tbody>' +
'<tr><td>Time to first token (TTFT)</td><td>Delay before output starts</td><td>“Is it working?”</td></tr>' +
'<tr><td>Output tokens per second</td><td>Generation speed once started</td><td>Reading pace of a streamed answer</td></tr>' +
'<tr><td>End-to-end latency</td><td>Request in to final token out, including thinking and tool calls</td><td>Time until they can act</td></tr></tbody></table></div>' +
'<p><strong>Throughput</strong> and <strong>rate limits</strong> (requests and tokens per minute) cap how many users you can serve at once. Check them before launch, not during.</p>' +
'<div class="pm"><p class="eyebrow">What changes for you</p><ul><li>Write latency requirements as TTFT plus end-to-end, per surface. Streaming makes a 10-second answer feel acceptable, but a 10-second TTFT doesn’t.</li><li>Because outputs are samples, acceptance criteria must be rates (“≥ 95% of eval cases pass”), never single examples.</li></ul></div>' },

{ t: 'Kinds of models', shelf: 'Shifting', html:
'<p>“The model” is rarely one thing. Most products end up using several, chosen per task.</p>' +
'<ul><li><strong>Frontier vs small tiers.</strong> Each major lab ships a large, most-capable model and faster, cheaper tiers. The price gap between tiers is often 10× or more, and the small tier is frequently good enough for classification, routing, extraction and summarisation.</li><li><strong>Reasoning (“thinking”) models</strong> spend extra tokens working through a problem before answering. This is <strong>test-time compute</strong>: you buy accuracy on hard, multi-step problems with latency and cost. Many APIs expose a thinking budget or effort setting, which is a product decision.</li><li><strong>Open-weight vs closed.</strong> Open-weight models can be self-hosted, fine-tuned freely and kept inside your network. You take on hosting, scaling and safety work, and usually trail the frontier by months.</li><li><strong>Multimodal</strong> models take images, audio, documents or video as input, and some generate them.</li><li><strong>Embedding models</strong> turn text into vectors so similar meanings sit close together. They power search and retrieval and don’t generate text.</li><li><strong>Distillation</strong> trains a small model to imitate a large one. <strong>Quantization</strong> stores weights at lower precision to run cheaper and faster, at some quality cost. <strong>Mixture-of-experts</strong> models activate only part of their parameters per token, so parameter count and cost don’t move together.</li></ul>' +
'<p>Every model has a <strong>knowledge cutoff</strong>, the date its training data ends, and a <strong>model card</strong> describing intended use, evaluations and known limits. Read both before you commit.</p>' +
'<div class="pm"><p class="eyebrow">What changes for you</p><ul><li>Treat model choice as per-task routing, not a single vendor decision. A cascade (small model first, escalate when unsure) is a standard cost pattern.</li><li>Put the thinking budget in your spec. It’s a quality, latency and cost dial in one.</li><li>Pin model versions in production and plan upgrades deliberately (Chapter 10).</li></ul></div>' },

{ t: 'The behaviour-change ladder', shelf: 'Durable', html:
'<p>When a model doesn’t do what you want, there’s an ordered set of fixes. Each rung is slower and more expensive than the one below. Climb only when your evals show the rung below has plateaued.</p>' +
'<div class="tbl"><table><thead><tr><th>Rung</th><th>What it changes</th><th>Time to try</th><th>Use when</th></tr></thead><tbody>' +
'<tr><td>1. Instructions</td><td>The system prompt and task framing</td><td>Minutes</td><td>Always first</td></tr>' +
'<tr><td>2. Examples</td><td>Few-shot demonstrations of good output</td><td>Hours</td><td>Format, tone or judgement is off</td></tr>' +
'<tr><td>3. Context and tools</td><td>Retrieval, tool access, better inputs</td><td>Days</td><td>The model lacks facts or the ability to act</td></tr>' +
'<tr><td>4. Model choice</td><td>A different tier, vendor or reasoning budget</td><td>Days</td><td>Capability is the ceiling</td></tr>' +
'<tr><td>5. Fine-tuning</td><td>Weights, via SFT, preference tuning, RL fine-tuning or adapters such as LoRA</td><td>Weeks</td><td>A narrow, stable, high-volume task with lots of graded examples</td></tr>' +
'<tr><td>6. Pretraining</td><td>A new base model</td><td>Months</td><td>Almost never, for product teams</td></tr></tbody></table></div>' +
'<p><strong>Supervised fine-tuning (SFT)</strong> teaches from input-output pairs. <strong>Preference tuning</strong> (such as RLHF or DPO) teaches from “A is better than B”. <strong>RL fine-tuning</strong> rewards outputs that pass a grader, which works well when correctness can be checked automatically. Fine-tuning is mostly for <em>behaviour</em> (format, style, a specialised skill), and a poor way to add <em>facts</em>, which go stale and can’t be cited.</p>' +
'<div class="callout"><p class="eyebrow">The trap</p><p>“We’ll fine-tune it” is often proposed at rung 1 to avoid the unglamorous work of rungs 2 and 3. Also, the next base model frequently beats last quarter’s fine-tune, which is a reason to keep your eval set and drop the custom weights.</p></div>' +
'<div class="pm"><p class="eyebrow">What changes for you</p><ul><li>Ask “which rung are we on, and what did the eval say about the last one?” in every quality review.</li><li>Budget fine-tuning as a recurring cost, since each new base model invites a re-run.</li></ul></div>' },

{ t: 'Agents and tools', shelf: 'Shifting fast', html:
'<p><strong>Tool use</strong> (also called function calling) lets a model request an action, such as a search, an API call or running code, which your application executes and returns. An <strong>agent</strong> is a model in a loop: it decides on an action, observes the result and repeats until it judges the task done or hits a limit. The code around the model that runs this loop, manages context and enforces limits is the <strong>harness</strong> (or scaffold).</p>' +
'<ul><li><strong>MCP (Model Context Protocol)</strong> is an open standard for connecting models to tools and data through “servers”. It’s the de facto way to plug systems into agents. Anthropic donated it to the Linux Foundation’s Agentic AI Foundation in December 2025.</li><li><strong>A2A (Agent2Agent)</strong> is a protocol for agents to discover and call other agents across vendors. MCP connects an agent to tools; A2A connects agents to each other.</li><li><strong>Skills</strong> package instructions, scripts and reference files that an agent loads only when a task needs them, which keeps the context small.</li><li><strong>Computer use</strong> lets a model operate a screen, keyboard and browser for software with no API.</li><li><strong>Subagents</strong> and <strong>orchestration</strong> split a large task across several model instances, each with its own focused context.</li><li><strong>Human in the loop</strong> means a person approves, edits or can interrupt the agent at defined points.</li></ul>' +
'<div class="callout"><p class="eyebrow">Compounding error</p><p>If each step succeeds 95% of the time, a 20-step task succeeds about 36% of the time (0.95<sup>20</sup>). Long agent runs need per-step reliability far above what’s acceptable for a single answer, plus checkpoints and recovery.</p></div>' +
'<div class="pm"><p class="eyebrow">What changes for you</p><ul><li>Specify an <strong>autonomy level</strong> for every agent feature: suggest, draft, act with approval, or act. It’s the most important line in an agent spec.</li><li>Define the stopping condition and the step and spend limits explicitly.</li><li>Treat tool descriptions as product copy. The model reads them, and their quality directly affects behaviour.</li></ul></div>' },

{ t: 'Quality and evaluation', shelf: 'Durable', html:
'<p>You can’t manage what you can’t measure, and with AI you can’t measure by trying a few examples.</p>' +
'<ul><li><strong>Hallucination</strong> (or confabulation): fluent, confident output that isn’t supported by facts or the provided sources. It’s a property of how models generate, so it can be reduced but not removed.</li><li><strong>Grounding</strong>: tying answers to supplied sources, ideally with <strong>citations</strong> users can check.</li><li><strong>Evals</strong>: systematic tests of model behaviour. <strong>Offline evals</strong> run a fixed dataset before shipping. <strong>Online evals</strong> measure real usage: acceptance, edits, retries, escalations.</li><li><strong>Golden set</strong>: a curated set of inputs with expected outputs or grading rubrics, covering common cases and the long tail.</li><li><strong>LLM-as-judge</strong>: using a model to grade outputs against a rubric. Fast and scalable, but only trustworthy once calibrated against human grades.</li><li><strong>pass@k vs pass^k</strong>: pass@k is “at least one of k tries succeeds” (capability). pass^k is “all k tries succeed” (reliability). Benchmarks usually report the first; products live or die on the second.</li><li><strong>Benchmark contamination</strong>: test questions leaking into training data, which inflates scores. One reason to trust your own evals over leaderboards.</li><li><strong>Sycophancy</strong>: the tendency to agree with the user or tell them what they want to hear.</li><li><strong>Jagged frontier</strong>: models can be superhuman at one task and fail a nearby, easier one. Never extrapolate capability from a demo.</li></ul>' +
'<div class="pm"><p class="eyebrow">What changes for you</p><ul><li>Your acceptance criteria are an eval. Write them as a dataset and a pass threshold, not prose (Chapter 5).</li><li>Ask for pass^k on the critical path. A feature that works 4 times in 5 feels broken to users.</li><li>Read real outputs every week. Error analysis is the PM’s highest-leverage habit in AI products.</li></ul></div>' }
];

    if (t.checked) done[t.dataset.key] = 1; else delete done[t.dataset.key]; save();
    var a = document.querySelector('[data-jump="l' + t.dataset.key.split('.')[1] + '"]'); if (a) a.classList.toggle('done', t.checked);
    var c1 = CH[+t.dataset.key.split('.')[0] - 1];
    var p = document.getElementById('chprog'); if (p && c1) p.innerHTML = progressHTML(c1);
    if (c1 && t.checked && doneCount(c1) === lessonCount(c1) && !done['gift-' + c1.id]) {
      var item = pickJunk(); done['gift-' + c1.id] = item.id; done['junk-' + item.id] = 1; save();
      Hop.celebrate(c1, item);
    }
    return;
  }
  if (t.dataset && t.dataset.lab) { if (t.checked) done[t.dataset.lab] = 1; else delete done[t.dataset.lab]; save(); return; }
  onQuiz(e);
});
